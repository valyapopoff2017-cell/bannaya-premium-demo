<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Банная мануфактура — Premium Demo</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111615;color:#eee9df;font:16px Arial,sans-serif}a{color:inherit;text-decoration:none}header{position:sticky;top:0;background:#141a19ee;backdrop-filter:blur(15px);z-index:10;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:22px 6%;gap:15px}.brand{font:700 22px Georgia,serif;letter-spacing:2px}nav{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}nav a:hover,.gold{color:#cba977}.hero{padding:110px 7%;background:linear-gradient(90deg,#111615f5,#11161577),url('https://images.unsplash.com/photo-1510798831971-661eb04b3739?w=1600') center/cover;min-height:560px}.eyebrow{color:#cba977;text-transform:uppercase;letter-spacing:3px;font-size:12px}h1{font:normal clamp(42px,6vw,80px) Georgia,serif;max-width:780px;line-height:1.1}h2{font:normal 42px Georgia,serif}p{line-height:1.7;color:#c7c9c3}.btn{display:inline-block;border:1px solid #cba977;padding:15px 24px;color:#e7c18c;background:#1b2220;cursor:pointer;margin-top:15px}.btn:hover{background:#cba977;color:#151917}main section{padding:65px 7%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:22px}.card{background:#1b2220;border:1px solid #343d39;overflow:hidden}.card img{width:100%;height:220px;object-fit:cover}.card .inside{padding:22px}.card h3{font:normal 25px Georgia,serif;margin:0 0 12px}.price{color:#d5b17a;font-size:20px}.muted{color:#a9aea7}.detail{display:grid;grid-template-columns:1fr 1fr;gap:35px}.detail img{width:100%;max-height:470px;object-fit:cover}.field{display:block;margin:14px 0}input,select,textarea{width:100%;padding:13px;background:#222b28;border:1px solid #58615b;color:white}footer{padding:35px 7%;border-top:1px solid #343d39;color:#a9aea7}.hidden{display:none}@media(max-width:700px){header{display:block}nav{margin-top:15px}.detail{grid-template-columns:1fr}.hero{padding-top:65px;min-height:440px}main section{padding:45px 6%}}
.brand{display:flex;align-items:center;gap:10px;font:normal 20px/0.95 Georgia,serif;letter-spacing:.2px;color:#e8d4b5}.brand-emblem{width:51px;height:51px;display:block}.brand-emblem svg{width:100%;height:100%}.brand-words{white-space:nowrap}.groupnav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 32px}.groupnav a{border:1px solid #5c5548;padding:11px 14px;color:#e4d4b8;border-radius:3px}.groupnav a:hover{background:#cba977;color:#111}.group-section{padding:35px 0!important;border-top:1px solid #343d39}.group-section h2{font-size:34px}.notice{border-left:2px solid #cba977;padding:15px 20px;background:#1b2220;max-width:800px}.intro-actions{display:flex;gap:12px;flex-wrap:wrap}.intro-actions .btn{margin-top:5px}@media(max-width:700px){.brand{font-size:18px}.brand-emblem{width:44px;height:44px}} .brand{display:flex;align-items:center;flex-shrink:0;color:#f7f5f0;line-height:1}.brand-logo{display:block;width:clamp(230px,26vw,340px);height:auto;overflow:visible}@media(max-width:700px){.brand-logo{width:230px}header{gap:12px}} </style></head><body><header><a href="#/" class="brand" aria-label="Банная Мануфактура — главная"><img class="brand-logo" src="https://raw.githubusercontent.com/valyapopoff2017-cell/bannaya-premium-demo/main/logo-original.png" alt="Банная Мануфактура"></a><nav><a href="#/">Главная</a><a href="#/catalog">Каталог</a><a href="#/calculator">Калькулятор</a><a href="#/reviews">Отзывы</a><a href="#/contacts">Контакты</a><a href="#/order">Заказ</a></nav></header><main id="app"></main><footer>© Банная мануфактура · Демонстрационная версия для согласования. Цены бань-бочек взяты с основного сайта; перед продажей необходимо проверить актуальность.</footer><script>
const photo='https://images.unsplash.com/photo-1510798831971-661eb04b3739?w=1000';
const products=[["Баня бочка «210»",191000],["Баня бочка «210» с крыльцом",209000],["Баня бочка «210» с навесом",199000],["Баня бочка «300»",253000],["Баня бочка «300» с крыльцом",272000],["Баня бочка «300» с навесом",261000],["Баня бочка «350»",270000],["Баня бочка «350» с крыльцом",290000],["Баня бочка «350» с навесом",281000],["Баня бочка «400» с боковым входом",306000],["Баня бочка «400» с крыльцом",321000],["Баня бочка «400» с навесом",313000],["Баня бочка «500» с крыльцом",364000],["Баня бочка «500» с навесом",356000],["Баня бочка «600» с верандой",409000],["Баня бочка «600» с крыльцом",387000]];
const groups=["Бани-бочки","Бани-квадробочки","Бани Викинг","Баня Парус","Модульные бани","Капсульные бани","Квадро-овальные бани","Модульные дома"];
const money=n=>Number(n).toLocaleString('ru-RU')+' ₽';const el=document.getElementById('app');
const card=(p,i)=>'<article class="card"><a href="#/product/'+i+'"><img src="'+photo+'" alt="'+p[0]+'"><div class="inside"><h3>'+p[0]+'</h3><p>Индивидуальная комплектация под ваш участок</p><div class="price">от '+money(p[1])+'</div><span class="btn">Подробнее →</span></div></a></article>';
const catalog=()=>'<section><div class="eyebrow">Коллекция</div><h2>Каталог продукции</h2><p>Выберите направление. Подтверждённые на основном сайте названия и цены бань-бочек приведены ниже. Остальные разделы подготовлены для наполнения после сверки товарных карточек.</p><div class="groupnav">'+groups.map((g,i)=>'<a href="#/catalog/'+i+'">'+g+'</a>').join('')+'</div>'+groups.map((g,i)=>'<section class="group-section" id="group-'+i+'"><div class="eyebrow">Раздел '+String(i+1).padStart(2,'0')+'</div><h2>'+g+'</h2>'+(i===0?'<div class="grid">'+products.map(card).join('')+'</div>':'<div class="notice"><p>Модели и цены этого раздела ещё сверяются с исходным каталогом. Не показываем вымышленные предложения.</p><a class="btn" href="https://bannaya-manufactura.ru/" target="_blank" rel="noopener">Открыть исходный каталог</a></div>')+'</section>').join('')+'</section>';
function render(){let path=decodeURI(location.hash.slice(1)||'/');let html='';
if(path==='/')html='<div class="hero"><div class="eyebrow">Тепло, созданное с характером</div><h1>Ваше место силы. Ваша баня.</h1><p>Премиальные бани и загородные пространства для отдыха.</p><a class="btn" href="#/catalog">Смотреть коллекцию</a></div><section><div class="eyebrow">Искусство загородной жизни</div><h2>Больше, чем баня</h2><p>Продуманная архитектура, натуральные материалы и комфорт в каждой детали.</p></section>'+catalog();
else if(path.startsWith('/catalog')){html=catalog();let gi=Number(path.split('/')[2]);if(Number.isInteger(gi)&&gi>=0&&gi<groups.length)setTimeout(()=>document.getElementById('group-'+gi)?.scrollIntoView({behavior:'smooth'}),40)}
else if(path.startsWith('/product/')){let i=Number(path.split('/')[2]),p=products[i];html=p?'<section><a class="gold" href="#/catalog">← Каталог</a><div class="detail" style="margin-top:25px"><img src="'+photo+'" alt="'+p[0]+'"><div><div class="eyebrow">Коллекция Банная мануфактура</div><h1 style="font-size:48px">'+p[0]+'</h1><p>Персональная комплектация, качественные материалы, продуманный комфорт. Фотография демонстрационная.</p><div class="price">от '+money(p[1])+'</div><p>Отдельная ссылка на эту модель: её можно отправить клиенту.</p><a class="btn" href="#/calculator?model='+i+'">Рассчитать стоимость</a> <a class="btn" href="#/order?model='+i+'">Заказать</a></div></div></section>':'<section><h2>Модель не найдена</h2></section>'}
else if(path.startsWith('/calculator')){let idx=Number((path.match(/model=(\d+)/)||[])[1]||0);html='<section><div class="eyebrow">Подбор комплектации</div><h2>Калькулятор стоимости</h2><p>Предварительный расчёт. Дополнительные опции и их цены — демонстрационные до загрузки прайс-листа.</p><div style="max-width:600px"><label class="field">Модель<select id="model">'+products.map((p,i)=>'<option value="'+i+'" '+(i===idx?'selected':'')+'>'+p[0]+' — '+money(p[1])+'</option>').join('')+'</select></label><label class="field"><input type="checkbox" id="porch" style="width:auto"> Крыльцо (+19 000 ₽, демо)</label><label class="field"><input type="checkbox" id="light" style="width:auto"> Освещение (+7 500 ₽, демо)</label><label class="field"><input type="checkbox" id="delivery" style="width:auto"> Доставка (+12 000 ₽, демо)</label><h2 id="sum"></h2><button class="btn" onclick="window.print()">Сохранить расчёт в PDF</button></div></section>'}
else if(path==='/reviews')html='<section><div class="eyebrow">Доверие</div><h2>Отзывы и реализованные проекты</h2><p>Здесь будут размещены подтверждённые отзывы покупателей и фотографии построенных объектов после согласования с компанией.</p></section>';
else if(path==='/contacts')html='<section><div class="eyebrow">На связи</div><h2>Контакты</h2><p>Контактные данные компании и менеджеров будут внесены после подтверждения руководством.</p><a class="btn" href="#/order">Оставить заявку</a></section>';
else if(path.startsWith('/order'))html='<section><div class="eyebrow">Индивидуальный подход</div><h2>Оформление заказа</h2><p>Форма для демонстрации. Отправка заявок будет подключена после настройки серверной части.</p><form onsubmit="event.preventDefault();alert(\'Демонстрационная форма: заявка не отправлена\')"><label class="field">Имя<input required placeholder="Ваше имя"></label><label class="field">Телефон<input required placeholder="+7 ..."></label><label class="field">Пожелания<textarea rows="4"></textarea></label><button class="btn">Отправить заявку</button></form></section>';
else html='<section><h2>Страница не найдена</h2></section>';
el.innerHTML=html;if(path.startsWith('/calculator')){let calc=()=>{let i=+document.getElementById('model').value,n=products[i][1]+(document.getElementById('porch').checked?19000:0)+(document.getElementById('light').checked?7500:0)+(document.getElementById('delivery').checked?12000:0);document.getElementById('sum').textContent='Итого: '+money(n)};el.querySelectorAll('input,select').forEach(x=>x.addEventListener('change',calc));calc()}if(!path.startsWith('/catalog/'))window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script></body></html>
