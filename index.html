async function initLocationsMap(){
const node=document.getElementById('locations-map'),status=document.getElementById('locations-map-status');
if(!node||!window.L){status.textContent='Карта недоступна. Используйте ссылки на Яндекс Карты рядом с адресами.';return;}
if(window._showroomMap)window._showroomMap.remove();
const map=L.map(node,{scrollWheelZoom:false}).setView([55.75,37.5],9);window._showroomMap=map;
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const locations=[
['Синдика','65-й км МКАД, внешнее кольцо, Москва','МКАД 65 км Синдика Москва'],
['Домодедовская','Каширское шоссе, 63 строение 53, Москва','Москва Каширское шоссе 63 строение 53'],
['Балтия','Новорижское шоссе, 10-й км, Москва','Новорижское шоссе 10 км садовый центр Балтия'],
['Народного Ополчения','Москва, улица Народного Ополчения, 43 корпус 2','Москва Народного Ополчения 43 корпус 2'],
['Малоэтажная страна','Котельники, Дзержинское шоссе, 7/7','Котельники Дзержинское шоссе 7/7']
];
const bounds=[],missing=[];
for(const [name,address,query] of locations){
try{
const response=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ru&q='+encodeURIComponent(query));
if(!response.ok)throw Error('search');
const result=await response.json();
if(!result.length){missing.push(name);continue;}
const lat=+result[0].lat,lon=+result[0].lon;
if(!Number.isFinite(lat)||!Number.isFinite(lon))throw Error('coordinates');
bounds.push([lat,lon]);
const popup=document.createElement('div'),heading=document.createElement('strong'),desc=document.createElement('p'),link=document.createElement('a');
heading.textContent=name;desc.textContent=address;link.textContent='Открыть в Яндекс Картах';link.href='https://yandex.ru/maps/?text='+encodeURIComponent(address);link.target='_blank';link.rel='noopener noreferrer';
popup.append(heading,desc,link);L.marker([lat,lon]).addTo(map).bindPopup(popup);
}catch(e){missing.push(name);}
}
if(bounds.length)map.fitBounds(bounds,{padding:[35,35],maxZoom:11});
status.textContent=missing.length?'Отмечено '+bounds.length+' из 5 площадок. Не найдены автоматически: '+missing.join(', ')+'. Их можно открыть по ссылкам выше.':'Все пять площадок отмечены. Нажмите на маркер для просмотра адреса.';
map.on('click',()=>map.scrollWheelZoom.enable());
setTimeout(()=>map.invalidateSize(),100);
}
